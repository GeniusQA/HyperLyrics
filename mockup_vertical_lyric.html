<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>岛上歌词滚动效果对比</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 18px;
    padding: 24px;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
  }
  h1 { font-size: 18px; margin: 0; opacity: .9; }
  .controls {
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,.08);
    padding: 6px;
    border-radius: 999px;
  }
  .controls button {
    border: none;
    background: transparent;
    color: #fff;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
  }
  .controls button.active { background: #ff4da6; font-weight: 600; }

  /* 手机屏容器 */
  .phone {
    width: 360px;
    height: 760px;
    background: linear-gradient(180deg, #2b1338 0%, #0f0c29 100%);
    border-radius: 40px;
    padding: 55px 20px 30px;
    box-shadow: 0 25px 70px rgba(0,0,0,.55);
    position: relative;
    overflow: hidden;
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 22px; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 22px;
    background: #000;
    border-radius: 12px;
  }
  .clock { font-size: 64px; font-weight: 300; letter-spacing: -1px; margin-bottom: 4px; }
  .date { font-size: 15px; opacity: .75; margin-bottom: 28px; }

  /* 灵动岛卡片 */
  .island-card {
    width: 100%;
    border-radius: 28px;
    padding: 14px 16px 14px 14px;
    background: linear-gradient(135deg, #d63384 0%, #7b2cbf 60%, #3a0ca3 100%);
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .island-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><text x="10" y="80" font-size="70" fill="rgba(255,255,255,0.06)" font-weight="900">MADE MY NIGHT</text></svg>');
    background-size: 220% auto;
    background-position: 80% 60%;
    pointer-events: none;
  }
  .row-top { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .cover {
    width: 52px; height: 52px;
    border-radius: 10px;
    background: #222 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23111" width="100" height="100"/><circle cx="50" cy="50" r="35" fill="none" stroke="%23ff4da6" stroke-width="3"/><path d="M40 35 L40 65 L70 50 Z" fill="%23ff4da6"/></svg>');
    background-size: cover;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  .meta { flex: 1; min-width: 0; }
  .title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 13px; opacity: .85; margin-top: 2px; }

  /* 歌词区 —— 两种模式共用容器 */
  .lyric-box {
    position: relative;
    height: 92px;
    border-radius: 14px;
    background: rgba(0,0,0,.18);
    overflow: hidden;
    z-index: 1;
  }

  /* 模式 A：水平跑马灯 */
  .mode-h .track {
    position: absolute;
    top: 0; left: 0; height: 100%;
    display: flex; align-items: center;
    white-space: nowrap;
    padding: 0 14px;
    will-change: transform;
  }
  .mode-h .line-main {
    font-size: 18px;
    font-weight: 600;
    color: #4fffd1;
    text-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .mode-h .line-sub {
    font-size: 14px;
    color: rgba(255,255,255,.75);
    margin-left: 14px;
  }
  .mode-h .ghost {
    margin-left: 40px;
    opacity: .55;
  }

  /* 模式 B：单行歌词自动换行 + 翻译在下 */
  .mode-v .lyric-current {
    position: absolute;
    left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    padding: 0 14px;
    transition: opacity .3s;
  }
  .mode-v .line-main {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    color: #4fffd1;
    text-shadow: 0 1px 4px rgba(0,0,0,.35);
    word-break: break-word;
  }
  .mode-v .line-sub {
    font-size: 13px;
    opacity: .82;
    line-height: 1.4;
    margin-top: 5px;
    word-break: break-word;
  }

  /* 进度条 */
  .progress-wrap { position: relative; z-index: 1; }
  .progress-times { display: flex; justify-content: space-between; font-size: 12px; opacity: .85; margin-bottom: 5px; }
  .progress-bar { height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 13%; background: #fff; border-radius: 2px; }

  .note {
    max-width: 360px;
    font-size: 13px;
    line-height: 1.6;
    opacity: .7;
  }
  .note b { color: #ff4da6; }
</style>
</head>
<body>
  <h1>岛上歌词滚动效果对比</h1>
  <div class="controls">
    <button id="btn-h" class="active" onclick="setMode('h')">当前：水平左滚</button>
    <button id="btn-v" onclick="setMode('v')">目标：垂直滚动</button>
  </div>

  <div class="phone">
    <div class="clock">11:21</div>
    <div class="date">9月12日 周六</div>

    <div class="island-card" id="card">
      <div class="row-top">
        <div class="cover"></div>
        <div class="meta">
          <div class="title">Made My Night</div>
          <div class="artist">LE SSERAFIM</div>
        </div>
      </div>

      <div class="lyric-box mode-h" id="lyricBox">
        <!-- 水平模式 -->
        <div class="track" id="hTrack">
          <span class="line-main" id="hMain"></span>
          <span class="line-sub" id="hSub"></span>
          <span class="line-main ghost" id="hMainGhost"></span>
          <span class="line-sub ghost" id="hSubGhost"></span>
        </div>
        <!-- 垂直模式 -->
        <div class="lyric-current" id="vCurrent">
          <div class="line-main" id="vMain"></div>
          <div class="line-sub" id="vSub"></div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-times"><span>00:13</span><span>02:06</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
  </div>

  <div class="note">
    <b>水平模式问题：</b>单行歌词超长时被裁切，整体向左滚动，右侧会随文本移出出现空白。<br>
    <b>垂直模式方案：</b>歌词按容器宽度自动换行成多行，当前演唱行高亮居中，上下文行渐隐缩小，整体上下滚动。视觉更稳，不会出现右侧大面积留白。
  </div>

<script>
  const lyrics = [
    { main: "I'm not so sure how to feel", sub: "我不确定该如何感受", dur: 3200 },
    { main: "To tell you the truth", sub: "说实话", dur: 2800 },
    { main: "I don't know what to do", sub: "我不知道该做什么", dur: 3500 },
    { main: "But I'll be right here waiting for you", sub: "但我会一直在这里等你", dur: 4200 },
    { main: "Made my night, you made my night", sub: "点亮了我的夜晚", dur: 3800 },
    { main: "Underneath the city lights", sub: "在城市灯火下", dur: 3600 },
    { main: "Every moment feels so right", sub: "每一刻都感觉如此美好", dur: 3400 },
    { main: "I'm not so sure how to feel to tell you the truth", sub: "说实话 我不知道该作何感想", dur: 4500 },
  ];

  const box = document.getElementById('lyricBox');
  const hTrack = document.getElementById('hTrack');
  const hMain = document.getElementById('hMain');
  const hSub = document.getElementById('hSub');
  const hMainGhost = document.getElementById('hMainGhost');
  const hSubGhost = document.getElementById('hSubGhost');
  const vCurrent = document.getElementById('vCurrent');
  const vMain = document.getElementById('vMain');
  const vSub = document.getElementById('vSub');
  const progressFill = document.getElementById('progressFill');

  let mode = 'h';
  let index = 0;
  let lineStart = performance.now();
  let hOffset = 0;
  let raf;

  function setMode(m) {
    mode = m;
    document.getElementById('btn-h').classList.toggle('active', m === 'h');
    document.getElementById('btn-v').classList.toggle('active', m === 'v');
    box.className = 'lyric-box mode-' + m;
    hTrack.style.transform = '';
    vStack.style.transform = '';
    render();
  }

  function render() {
    const l = lyrics[index];
    hMain.textContent = l.main;
    hSub.textContent = l.sub;
    hMainGhost.textContent = l.main;
    hSubGhost.textContent = l.sub;

    // 垂直模式：当前这一句主歌词（自动换行）+ 翻译在下
    vMain.textContent = l.main;
    vSub.textContent = l.sub;
  }

  function nextLine() {
    index = (index + 1) % lyrics.length;
    lineStart = performance.now();
    hOffset = 0;
    render();
  }

  function loop(now) {
    const elapsed = now - lineStart;
    const l = lyrics[index];

    if (mode === 'h') {
      // 模拟水平跑马灯：先停 400ms，再匀速左移
      const trackW = hTrack.scrollWidth / 2; // 一份内容宽度
      const boxW = box.clientWidth;
      const travel = Math.max(0, trackW - boxW + 40);
      const speed = 0.06; // px/ms
      const delay = 400;
      let x = 0;
      if (elapsed > delay) {
        x = Math.min(travel, (elapsed - delay) * speed);
      }
      hTrack.style.transform = `translateX(${-x}px)`;
      if (elapsed > l.dur) nextLine();
    } else {
      if (elapsed > l.dur) nextLine();
    }

    progressFill.style.width = (13 + (index / lyrics.length) * 70) + '%';
    raf = requestAnimationFrame(loop);
  }

  render();
  raf = requestAnimationFrame(loop);
</script>
</body>
</html>
