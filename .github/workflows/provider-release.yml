name: Provider Release

# 运行列表标题展示平台，例如 "Provider · kugou"（手动）或 tag 名（如 provider-kugou-v1.0.0）
run-name: Provider · ${{ inputs.provider || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to publish
        required: true
        type: choice
        options:
          - netease
          - qqmusic
          - kugou
          - kuwo
          - qishui
          - salt-player
          - spotify
  push:
    tags:
      - "provider-*-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.provider || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Resolve provider
        id: provider
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            provider='${{ inputs.provider }}'
          else
            provider="${GITHUB_REF_NAME#provider-}"
            provider="${provider%%-v*}"
          fi
          case "$provider" in
            netease) display_name="网易云音乐" ;;
            qqmusic) display_name="QQ音乐" ;;
            kugou) display_name="酷狗音乐" ;;
            kuwo) display_name="酷我音乐" ;;
            qishui) display_name="汽水音乐" ;;
            salt-player) display_name="椒盐音乐" ;;
            spotify) display_name="Spotify" ;;
            *) echo "Unsupported provider tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          echo "id=$provider" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"
      - name: Restore signing key
        env:
          HLE_PROVIDER_SIGNING_KEY_PEM: ${{ secrets.HLE_PROVIDER_SIGNING_KEY_PEM }}
        run: |
          test -n "$HLE_PROVIDER_SIGNING_KEY_PEM"
          printf '%s' "$HLE_PROVIDER_SIGNING_KEY_PEM" > signing-private.pem
          chmod 600 signing-private.pem
      - name: Build signed Provider Pack
        id: pack
        run: |
          provider='${{ steps.provider.outputs.id }}'
          manifest="HL-Providers/providers/$provider/provider.json"
          version_name=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["versionName"])' "$manifest")
          version_code=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["versionCode"])' "$manifest")
          target_packages=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1],encoding="utf-8"))["targetPackages"]))' "$manifest")
          asset="dist/${provider}-${version_name}.hlp"
          (cd HL-Providers && ./gradlew --no-daemon --max-workers=2 ":providers:$provider:assembleRelease")
          apk="HL-Providers/providers/$provider/build/outputs/apk/release/${provider}-release-unsigned.apk"
          python3 HL-Providers/scripts/build_provider_pack.py \
            --apk "$apk" \
            --manifest "$manifest" \
            --private-key signing-private.pem \
            --output "$asset"
          pack_sha=$(sha256sum "$asset" | cut -d' ' -f1)
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "target_packages=$target_packages" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$pack_sha" >> "$GITHUB_OUTPUT"
      - name: Update catalog & commit to main
        run: |
          provider='${{ steps.pack.outputs.provider }}'
          version_name='${{ steps.pack.outputs.version_name }}'
          version_code='${{ steps.pack.outputs.version_code }}'
          target_packages='${{ steps.pack.outputs.target_packages }}'
          pack_sha='${{ steps.pack.outputs.sha256 }}'
          asset_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/providers/${provider}-${version_name}.hlp"

          git config user.name "QuanTum2088"
          git config user.email "158152582+QuanTum2088@users.noreply.github.com"

          # 多个 provider 并行发布会竞争 push main；失败时基于最新 main 重试
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git switch -C main origin/main

            mkdir -p providers
            cp "${{ steps.pack.outputs.asset }}" "providers/${provider}-${version_name}.hlp"

            python3 HL-Providers/scripts/update_catalog.py \
              --catalog catalog/catalog.json \
              --provider "$provider" \
              --version-name "$version_name" \
              --version-code "$version_code" \
              --asset-url "$asset_url" \
              --sha256 "$pack_sha" \
              --target-packages "$target_packages"

            signature_file=$(mktemp)
            openssl pkeyutl -sign -rawin \
              -inkey signing-private.pem \
              -in catalog/catalog.json \
              -out "$signature_file"
            base64 -w0 "$signature_file" > catalog/catalog.sig
            printf '\n' >> catalog/catalog.sig
            openssl pkeyutl -verify -rawin -pubin \
              -inkey HL-Providers/keys/provider-signing-public.pem \
              -in catalog/catalog.json \
              -sigfile "$signature_file"

            git add "providers/${provider}-${version_name}.hlp" catalog/catalog.json catalog/catalog.sig
            if git diff --cached --quiet; then
              echo "catalog 已是最新，无需提交"
              exit 0
            fi
            git commit \
              -m "更新 $provider Provider 发布目录" \
              -m "- 同步 $version_name 版本与 CI 生成的 Pack 摘要。" \
              -m "- 使用项目 Ed25519 私钥重新签名官方目录。"
            if git push origin main; then
              echo "push 成功（attempt $attempt）"
              exit 0
            fi
            echo "push 失败，重试（attempt $attempt）" >&2
            sleep 5
          done
          echo "多次重试后仍无法 push main" >&2
          exit 1
