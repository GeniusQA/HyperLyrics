name: Android Build & Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '构建渠道 (canary=仅产物 / beta=预发布 / stable=正式发布)'
        required: true
        type: choice
        options:
          - canary
          - beta
          - stable
        default: canary

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 版本检测 Version Gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail

          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_OUTPUT"
          done < <(bash .github/scripts/resolve-version.sh)

          current_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=.*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          current_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=*[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${EVENT_NAME} trigger, proceeding with resolved version"
          elif [[ "$current_name" =~ -(beta|canary)$ ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${BASH_REMATCH[1]} channel commit detected, proceeding"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            previous_name="$(git show HEAD^:app/build.gradle.kts 2>/dev/null | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=.*"([^"]+)".*/\1/p' | head -n1 || true)"
            previous_code="$(git show HEAD^:app/build.gradle.kts 2>/dev/null | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=*[[:space:]]*([0-9]+).*/\1/p' | head -n1 || true)"

            if [[ "$current_name" != "$previous_name" || "$current_code" != "$previous_code" ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "version changed (Name: $previous_name -> $current_name, Code: $previous_code -> $current_code), proceeding"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "stable version unchanged (Name: $current_name, Code: $current_code), skipping build"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 JDK Setup Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK Setup Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: 配置 Gradle Setup Gradle
        if: steps.gate.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 授权脚本 Grant Permission
        if: steps.gate.outputs.skip != 'true'
        run: chmod +x gradlew .github/scripts/resolve-version.sh

      - name: 构建 Debug 或 Release Build
        if: steps.gate.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.gate.outputs.channel }}
          FULL_NAME: ${{ steps.gate.outputs.full_name }}
        run: |
          set -euo pipefail

          # release 变体要跑 Kotlin 后端 + R8，与 debug 在同一个 Gradle 进程里并发编译
          # 会撞上默认 kotlin.daemon.jvmargs=1536m 的堆上限（GC overhead limit exceeded）。
          # 因此：①拆成两次独立 Gradle 调用，②放宽 Gradle 与 Kotlin 编译器的堆。
          BUILD_ARGS=(
            --no-daemon
            --max-workers=2
            --build-cache
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            "-Pkotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
            -PciVersionName="$FULL_NAME"
          )

          if [[ "$CHANNEL" == "stable" ]]; then
            ./gradlew "${BUILD_ARGS[@]}" assembleDebug
            ./gradlew "${BUILD_ARGS[@]}" assembleRelease
          elif [[ "$CHANNEL" == "canary" ]]; then
            ./gradlew "${BUILD_ARGS[@]}" assembleDebug
          else
            ./gradlew "${BUILD_ARGS[@]}" assembleDebug
          fi

      - name: 上传 PR 构建产物 Upload PR Artifacts
        if: github.event_name == 'pull_request' && steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.gate.outputs.channel }}-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: 解码签名密钥 Decode Keystore
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > release.jks

      - name: 签名 APK Sign APK
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false'
        env:
          STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          CHANNEL: ${{ steps.gate.outputs.channel }}
          V_NAME: ${{ steps.gate.outputs.full_name }}
          V_CODE: ${{ steps.gate.outputs.code }}
        run: |
          set -euo pipefail

          BTDIR="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          ZA="$BTDIR/zipalign"
          AS="$BTDIR/apksigner"

          # 签名 release 产物（stable 会产出）
          RELEASE_IN=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit || true)
          if [[ -n "$RELEASE_IN" ]]; then
            $ZA -f -v -p 4 "$RELEASE_IN" release-aligned.apk
            $AS sign \
              --ks release.jks \
              --ks-pass env:STORE_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "HyperLyrics-release-v${V_NAME}-${V_CODE}.apk" \
              release-aligned.apk
          fi

          # 签名 debug 产物（canary / stable / beta 会产出）
          DEBUG_IN=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-debug.apk' -print -quit || true)
          if [[ -n "$DEBUG_IN" ]]; then
            $ZA -f -v -p 4 "$DEBUG_IN" debug-aligned.apk
            $AS sign \
              --ks release.jks \
              --ks-pass env:STORE_PASS \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS \
              --out "HyperLyrics-debug-v${V_NAME}-${V_CODE}.apk" \
              debug-aligned.apk
          fi

      - name: 上传 Canary 构建产物 Upload Canary Artifact
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'canary'
        uses: actions/upload-artifact@v7
        with:
          name: debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}
          path: HyperLyrics-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
          if-no-files-found: error
          compression-level: 0

      - name: 生成发布说明 Generate Release Body
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && (steps.gate.outputs.channel == 'stable' || steps.gate.outputs.channel == 'beta')
        id: release_body
        run: |
          set -euo pipefail

          PREV_TAG="${{ steps.gate.outputs.prev_stable_tag }}"
          CHANNEL="${{ steps.gate.outputs.channel }}"
          BODY_DELIMITER="release_body_$(git rev-parse HEAD)"
          echo "body<<$BODY_DELIMITER" >> "$GITHUB_OUTPUT"
          .github/scripts/generate-release-body.sh "$PREV_TAG" HEAD "$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "$BODY_DELIMITER" >> "$GITHUB_OUTPUT"

      - name: 创建正式版发布 Create Stable Release
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gate.outputs.full_name }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.gate.outputs.full_name }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            HyperLyrics-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
            HyperLyrics-release-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Beta Pre-release
        if: github.event_name != 'pull_request' && steps.gate.outputs.skip == 'false' && steps.gate.outputs.channel == 'beta'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gate.outputs.full_name }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.gate.outputs.full_name }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: true
          generate_release_notes: false
          files: HyperLyrics-debug-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 独立分支（com.genius.hyperlyrics）不再同步/发布到上游 LSPosed 仓库
      # （Xposed-Modules-Repo/com.juren233.hyperlyricsenhanced 属于上游发布线）。
